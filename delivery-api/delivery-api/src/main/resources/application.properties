# ============================================================
#  APLICAÇÃO
# ============================================================
spring.application.name=delivery-api

# ============================================================
#  SERVIDOR
# ============================================================
server.port=8080

# ============================================================
#  BANCO DE DADOS (H2 em memória)
# ============================================================
spring.datasource.url=jdbc:h2:mem:deliverydb
spring.datasource.username=sa
spring.datasource.password=

# ============================================================
#  H2 CONSOLE  ->  http://localhost:8080/h2-console
#  JDBC URL no console: jdbc:h2:mem:deliverydb
#  User: sa  |  Password: (vazio)
# ============================================================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ============================================================
#  JPA / HIBERNATE
# ============================================================
# create-drop: recria o schema a cada start (ótimo para dev com H2 em memória)
spring.jpa.hibernate.ddl-auto=create-drop
# Deixa o SQL do log formatado (quebrado em linhas)
spring.jpa.properties.hibernate.format_sql=true

# Garante que data.sql rode DEPOIS do Hibernate criar as tabelas
spring.jpa.defer-datasource-initialization=true

# ============================================================
#  INICIALIZAÇÃO DE DADOS (data.sql / schema.sql)
# ============================================================
# always: sempre roda | embedded (default): só em H2/HSQL/Derby | never
spring.sql.init.mode=always
# Se um dia quiser permitir continuar mesmo com erro num INSERT:
# spring.sql.init.continue-on-error=true

# ============================================================
#  DEVTOOLS
# ============================================================
spring.devtools.restart.enabled=true

# ============================================================
#  JPA - OPEN IN VIEW
# ============================================================
# Boa prática: não deixa a conexão com o banco aberta durante a requisição inteira.
# Atenção: com isso desligado, acessar uma coleção Lazy fora do repository
# pode gerar LazyInitializationException.
spring.jpa.open-in-view=false

# ============================================================
#  LOGGING
# ============================================================
logging.level.org.springframework.web=DEBUG
# Mostra o SQL executado pelo Hibernate (substitui o spring.jpa.show-sql)
logging.level.org.hibernate.SQL=DEBUG
# Mostra os valores que entram em cada "?" do SQL (nome atual, Hibernate 6/7)
logging.level.org.hibernate.orm.jdbc.bind=TRACE
